[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s3compat"
version = "0.1.0"
description = "Run the same S3 API operations against several S3-compatible endpoints and report behavioural differences."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "requests>=2.31",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[server]>=5.0",
]

[project.scripts]
s3compat = "s3compat.cli:main"

[tool.setuptools.packages.find]
include = ["s3compat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: runs against real endpoints; needs --live and credentials in the environment",
]
