name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  compare-local:
    # moto (stand-in for AWS) vs LocalStack, both over real HTTP.
    runs-on: ubuntu-latest
    needs: test
    services:
      localstack:
        image: localstack/localstack:3.8
        ports:
          - 4566:4566
        env:
          SERVICES: s3
          DISABLE_EVENTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4566/_localstack/health | grep -q '"s3": "\(available\|running\)"' && exit 0
            sleep 2
          done
          exit 1
      - name: Run comparison
        run: s3compat run --moto 5000 -t aws,localstack --checksums when_required --report-dir reports
      - name: Live tests against LocalStack
        env:
          S3COMPAT_CHECKSUMS: when_required
        run: pytest -q --live tests/test_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-report
          path: reports/
